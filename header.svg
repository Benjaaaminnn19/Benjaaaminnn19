<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#080b11" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="#080b11" rx="16"/>
  <rect width="1200" height="380" fill="url(#bg-glow)" rx="16"/>
  <rect width="1200" height="380" fill="url(#cyan-glow)" rx="16"/>

  <!-- Subtle starfield -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="120" cy="60" r="1.5" opacity="0.4"/>
    <circle cx="240" cy="140" r="1" opacity="0.6"/>
    <circle cx="350" cy="70" r="2" opacity="0.8"/>
    <circle cx="480" cy="190" r="1.5" opacity="0.3"/>
    <circle cx="590" cy="50" r="1" opacity="0.7"/>
    <circle cx="720" cy="110" r="1.8" opacity="0.5"/>
    <circle cx="840" cy="70" r="1.2" opacity="0.9"/>
    <circle cx="960" cy="150" r="2" opacity="0.6"/>
    <circle cx="1080" cy="90" r="1.5" opacity="0.4"/>
    <circle cx="150" cy="280" r="1.5" opacity="0.6"/>
    <circle cx="290" cy="320" r="2" opacity="0.5"/>
    <circle cx="420" cy="270" r="1" opacity="0.8"/>
    <circle cx="780" cy="300" r="1.5" opacity="0.6"/>
    <circle cx="920" cy="280" r="1.2" opacity="0.5"/>
    <circle cx="1050" cy="310" r="1.8" opacity="0.7"/>
  </g>

  <!-- Constellation lines -->
  <path d="M240 140 L350 70 L480 190" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1" fill="none"/>
  <path d="M720 110 L840 70 L960 150" stroke="#818cf8" stroke-opacity="0.15" stroke-width="1" fill="none"/>

  <!-- Center Astronaut Helmet Silhouette & Glow -->
  <g transform="translate(540, 60)">
    <!-- Helmet glow -->
    <ellipse cx="60" cy="75" rx="55" ry="65" fill="#38bdf8" opacity="0.15" filter="url(#glow)"/>
    <!-- Outer helmet -->
    <path d="M15 85 C10 40, 30 15, 60 15 C90 15, 110 40, 105 85 C100 120, 20 120, 15 85 Z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Visor reflecting cosmic glow -->
    <path d="M25 80 C22 50, 35 32, 60 32 C85 32, 98 50, 95 80 C92 102, 28 102, 25 80 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M32 75 C30 55, 40 42, 60 42 C70 42, 80 47, 86 58" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Backpack shoulders -->
    <path d="M-10 135 C15 110, 45 105, 60 105 C75 105, 105 110, 130 135 L120 150 L0 150 Z" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Typography Left & Right (Matching screenshot style) -->
  <text x="260" y="160" text-anchor="middle" fill="#f8fafc" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="12">BENJAMÍN</text>
  <text x="940" y="160" text-anchor="middle" fill="#94a3b8" font-family="'SF Pro Display', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="12">DEVELOPER</text>

  <!-- Center divider beam -->
  <line x1="200" y1="255" x2="1000" y2="255" stroke="url(#line-grad)" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="600" y="295" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" font-weight="600" letter-spacing="4">&gt; FULL STACK DEVELOPER · PYTHON · DJANGO · REACT &lt;</text>
  <text x="600" y="330" text-anchor="middle" fill="#64748b" font-family="'SF Pro Display', -apple-system, sans-serif" font-size="13" letter-spacing="2">CONVIRTIENDO IDEAS EN PROYECTOS, UN COMMIT A LA VEZ</text>
</svg>