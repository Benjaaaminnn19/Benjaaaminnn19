<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Benjamín · Ideas, código y proyectos</title>
  <desc id="desc">Cabecera de Benjaaaminnn19 con tipografía clara sobre fondo oscuro y una composición original de cubos isométricos y píxeles verdes.</desc>
